name: CI

# The examples consume the PUBLISHED packages (bffi from crates.io,
# @z2net/bffi from npm). The example tests dlopen the cdylibs produced
# by `cargo build --release --workspace`, so the js job builds first.
on:
  pull_request:
  push:
    branches: [main, dev/main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.98.0

      - uses: Swatinem/rust-cache@v2

      # the wry example is a workspace member: on Linux it links
      # webkit2gtk/gtk through pkg-config - the dev packages must be
      # present before any cargo step (Windows/macOS need nothing)
      - name: Install GTK/webkit dev packages (wry example)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev

      - name: cargo build (release)
        run: cargo build --release --workspace

      - name: cargo test
        run: cargo test --workspace

  js:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      # install the pinned toolchain explicitly ONCE before the build
      # (an automatic rustup install mid-job can race its own
      # components), and bring the GTK/webkit dev packages for the wry
      # example on Linux
      - uses: dtolnay/rust-toolchain@1.98.0

      - name: Install GTK/webkit dev packages (wry example)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev

      - uses: Swatinem/rust-cache@v2

      - name: bun install
        run: bun install

      # the example tests dlopen the built cdylibs - build before test
      - name: cargo build (release)
        run: cargo build --release --workspace

      # runs every example's e2e suite; the wry suite opens a real OS
      # window and is env-gated (BFFI_WRY_E2E=1) - skipped here by
      # default, which bun reports as skips (CI-safe)
      - name: bun test (example e2e suites)
        run: bun test
